[project]
name = "ab-test-replenishment"
version = "0.1.0"
description = "A/B test of two replenishment policies on a synthetic OPME catalog"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
